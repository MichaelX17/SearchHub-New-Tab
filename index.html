<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SearchHub</title>
  <link rel="icon" type="image/x-icon" href="resources/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Animated flare backgrounds -->
  <div class="flare flare1"></div>
  <div class="flare flare2"></div>

  <!-- Main card -->
  <main class="card" role="main">
    <header class="logo-row center">
      <div class="brand center">
        <div class="mark" id="brandMark">SearchHub</div>
        <div>
          <div class="description">Search everywhere from your new tab</div>
        </div>
      </div>
    </header>

    <section class="search-wrap">
      <div class="search-bar" role="search" aria-label="Search bar">
        <div class="search-icons" id="engineList">
          <button class="engine-btn" data-engine="youtube" title="YouTube" aria-pressed="false" id="eng-yt">
            <img src="resources/youtube_logo.png" alt="YouTube" aria-hidden="true">
          </button>
          <button class="engine-btn" data-engine="google" title="Google" aria-pressed="false" id="eng-google">
            <img src="resources/google_logo.png" alt="Google" aria-hidden="true">
          </button>
          <button class="engine-btn" data-engine="duckduckgo" title="DuckDuckGo" aria-pressed="false" id="eng-duck">
            <img src="resources/duckduckgo_logo.png" alt="DuckDuckGo" aria-hidden="true">
          </button>
          <button class="engine-btn" data-engine="startpage" title="Startpage" aria-pressed="false" id="eng-startpage">
            <img src="resources/startpage_logo.png" alt="Startpage" aria-hidden="true">
          </button>
        </div>

        <input type="text" id="searchInput" placeholder="Search the web..." aria-label="Search" autocomplete="off" />

        <div class="actions">
          <button class="search-btn" id="searchBtn">Search</button>
        </div>
      </div>

      <div class="footer center">Select a search engine and type your query. Press Enter or click <strong>Search</strong>.</div>
    </section>

    <!-- Profile selector -->
    <div class="profile-selector" id="profileSelector">
      <button class="profile-btn" data-profile="blue-purple" title="Blue & Purple" style="--c1:#1e3a8a; --c2:#7c3aed;"></button>
      <button class="profile-btn" data-profile="red-black" title="Red & Black" style="--c1:#dc2626; --c2:#111827;"></button>
      <button class="profile-btn" data-profile="pink-white" title="Pink & White" style="--c1:#ec4899; --c2:#f3f4f6;"></button>
      <button class="profile-btn" data-profile="green-blue" title="Green & Blue" style="--c1:#059669; --c2:#38bdf8;"></button>
      <button class="profile-btn" data-profile="orange-yellow" title="Orange & Yellow" style="--c1:#ea580c; --c2:#facc15;"></button>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
